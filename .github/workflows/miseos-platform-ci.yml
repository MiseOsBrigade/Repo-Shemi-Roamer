name: MiseOS Platform CI

on:
  pull_request:
    paths:
      - "MiseOS-developer-platform/**"
      - ".github/workflows/miseos-platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "MiseOS-developer-platform/**"
      - ".github/workflows/miseos-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MiseOS-developer-platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify platform
        run: pnpm verify
