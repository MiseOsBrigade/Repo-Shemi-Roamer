name: μLink-A2A

on:
  push:
    paths:
      - "microlink-a2a/**"
      - ".github/workflows/microlink-a2a.yml"
  pull_request:
    paths:
      - "microlink-a2a/**"
      - ".github/workflows/microlink-a2a.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run μLink-A2A tests
        working-directory: microlink-a2a
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run μLink-A2A demo
        working-directory: microlink-a2a
        run: PYTHONPATH=src python examples/demo.py
