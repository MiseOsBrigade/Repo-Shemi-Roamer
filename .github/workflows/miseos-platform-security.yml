name: MiseOS Platform Security

on:
  pull_request:
    paths:
      - "MiseOS-developer-platform/**"
      - ".github/workflows/miseos-platform-security.yml"
  push:
    branches: [main]
    paths:
      - "MiseOS-developer-platform/**"
      - ".github/workflows/miseos-platform-security.yml"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  verify-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MiseOS-developer-platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm verify

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
