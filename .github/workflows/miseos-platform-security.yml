name: MiseOS Platform Security

on:
  pull_request:
    paths:
      - "MiseOS-developer-platform/**"
      - ".github/workflows/miseos-platform-security.yml"
  push:
    branches: [main]
    paths:
      - "MiseOS-developer-platform/**"
      - ".github/workflows/miseos-platform-security.yml"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
