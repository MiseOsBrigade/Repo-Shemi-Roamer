name: Shemi Roamer CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap source tree from release archive
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -f repo-shemi-roamer-0.1.0.tgz
          workdir="$(mktemp -d)"
          tar -xzf repo-shemi-roamer-0.1.0.tgz -C "$workdir"
          test -f "$workdir/package/package.json"
          cp -R "$workdir/package/." .

          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          build/
          coverage/
          .DS_Store
          *.log
          .env
          .env.*
          !.env.example
          *.tgz
          *.zip
          *.tar
          .nyc_output/
          .vscode/
          .idea/
          tmp/
          output/
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Repo Shemi Roamer source"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --ignore-scripts

      - name: Validate
        run: npm run check

      - name: Run bounded mascot demo
        run: npm run demo
