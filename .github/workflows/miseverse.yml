name: Miseverse Grid CI

on:
  push:
    paths:
      - "docs/miseverse/**"
      - "config/miseverse/**"
      - "src/characters.js"
      - "src/miseverse-grid.js"
      - "scripts/*miseverse*.mjs"
      - "schemas/*miseverse*.json"
      - "test/miseverse.test.js"
      - ".github/workflows/miseverse.yml"
  pull_request:
    paths:
      - "docs/miseverse/**"
      - "config/miseverse/**"
      - "src/characters.js"
      - "src/miseverse-grid.js"
      - "scripts/*miseverse*.mjs"
      - "schemas/*miseverse*.json"
      - "test/miseverse.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build:miseverse
      - run: npm run verify:miseverse
      - run: node --test test/miseverse.test.js
