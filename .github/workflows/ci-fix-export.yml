name: CI Fix Checkout Export

on:
  push:
    branches:
      - fix/all-workflows-20260806

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: ci-fix-checkout
          path: .
          include-hidden-files: true
          retention-days: 1
