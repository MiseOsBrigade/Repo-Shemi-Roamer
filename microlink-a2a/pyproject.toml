[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miseos-microlink-a2a"
version = "0.1.0"
description = "Behavioral model and protocol for a photonic AI agent-to-agent micro-link"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "MiseOS"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
