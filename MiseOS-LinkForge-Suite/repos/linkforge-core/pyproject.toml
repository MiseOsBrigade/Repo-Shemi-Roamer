[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "linkforge-core"
version = "1.0.0"
description = "Capture URLs and files into traceable research packets"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ai = ["openai>=1.60,<3"]
pdf = ["pypdf>=5,<7"]
media = ["yt-dlp>=2025.1"]
all = ["openai>=1.60,<3", "pypdf>=5,<7", "yt-dlp>=2025.1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
linkforge = "linkforge_core.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
