[tools]
python = "3.12"

[tasks.install]
run = "python -m pip install -e '.[all,dev]'"

[tasks.test]
run = "pytest -q"

[tasks.lint]
run = "ruff check src tests"

[tasks.check]
depends = ["test", "lint"]

[tasks.demo]
run = "linkforge capture examples/github-security-settings.txt --output artifacts/demo && linkforge verify artifacts/demo"
