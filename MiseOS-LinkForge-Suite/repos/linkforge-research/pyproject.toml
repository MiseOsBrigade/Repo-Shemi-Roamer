[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"
[project]
name="linkforge-research"
version="1.0.0"
requires-python=">=3.11"
dependencies=["httpx>=0.27,<1","pydantic>=2.9,<3"]
[project.optional-dependencies]
ai=["openai>=1.60,<3"]
dev=["pytest>=8,<10","ruff>=0.9,<1"]
[project.scripts]
linkforge-research="linkforge_research.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
