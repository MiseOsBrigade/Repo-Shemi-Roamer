name: MiseOS LinkForge Capture
description: Capture a URL or local file into a verified LinkForge packet
inputs:
  source:
    description: HTTPS URL or checked-out local file
    required: true
  output:
    description: Output directory
    required: false
    default: artifacts/linkforge
  provider:
    description: auto, openai, or extractive
    required: false
    default: auto
  python-version:
    description: Python runtime
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: python -m pip install "linkforge-core[all]>=1,<2"
    - shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        OUTPUT: ${{ inputs.output }}
        PROVIDER: ${{ inputs.provider }}
      run: linkforge capture "$SOURCE" --output "$OUTPUT" --provider "$PROVIDER"
    - shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
      run: linkforge verify "$OUTPUT"
