name: Verify packet
on:
  workflow_call:
    inputs:
      packet-path:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'linkforge-core>=1,<2'
      - run: linkforge verify "${{ inputs.packet-path }}"
