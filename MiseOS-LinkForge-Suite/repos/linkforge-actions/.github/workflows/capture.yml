name: Capture source packet
on:
  workflow_dispatch:
    inputs:
      source:
        description: HTTPS URL to capture
        required: true
        type: string
      provider:
        type: choice
        options: [extractive, auto, openai]
        default: extractive
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'linkforge-core[all]>=1,<2'
      - run: linkforge capture "${{ inputs.source }}" --output artifacts/source --provider "${{ inputs.provider }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - run: linkforge verify artifacts/source
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/source/*
      - uses: actions/upload-artifact@v4
        with:
          name: linkforge-packet
          path: artifacts/source
          if-no-files-found: error
          retention-days: 30
